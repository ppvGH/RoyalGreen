name: sac4ap verification

on:
  push:
    branches: [sac4ap]
  pull_request:
    branches: [sac4ap]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Select the documented CMake version
        run: python -m pip install cmake==3.31.6
      - name: Build tests and the unchanged application
        shell: pwsh
        run: ./scripts/run_checks.ps1 -Configuration ${{ matrix.configuration }} -BuildApplication
      - name: Keep test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sac4ap-${{ matrix.configuration }}-test-results
          path: |
            build/tests/test-results-*.xml
            build/tests/Testing/Temporary/LastTest.log
          if-no-files-found: warn